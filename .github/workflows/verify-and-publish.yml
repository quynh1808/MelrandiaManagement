name: verify-and-publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            Tests/packages.lock.json
      - name: Clear NuGet caches
        run: dotnet nuget locals all --clear
      - run: dotnet tool restore
      - run: dotnet restore MelrandiaManagement.sln --force-evaluate
      - run: dotnet build MelrandiaManagement.sln --configuration Release --no-restore
      - run: dotnet test MelrandiaManagement.sln --configuration Release --no-build --no-restore
      - run: dotnet ef migrations has-pending-model-changes --context ManagementDbContext --no-build --configuration Release

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore MelrandiaManagement.csproj --force-evaluate --runtime linux-x64
      - name: Publish immutable OCI image to GHCR
        run: >-
          dotnet publish MelrandiaManagement.csproj
          --configuration Release
          --no-restore
          --os linux
          --arch x64
          /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/melrandia-management
          -p:ContainerImageTag=sha-${{ github.sha }}

